# Local orchestration for the modernized (ASP.NET Core 8) Catalog apps plus SQL Server.
# Copy .env.example to .env and set MSSQL_SA_PASSWORD before running `docker compose up`.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  catalog-api:
    image: eshop/catalog-api:latest
    build:
      context: .
      dockerfile: modernized/src/Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__CatalogDb: "Server=sqlserver;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  catalog-web:
    image: eshop/catalog-web:latest
    build:
      context: .
      dockerfile: modernized/src/Catalog.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__CatalogDb: "Server=sqlserver;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "8081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  catalog-mvc:
    image: eshop/catalog-mvc:latest
    build:
      context: .
      dockerfile: modernized/src/Catalog.Mvc/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__CatalogDb: "Server=sqlserver;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "8082:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  catalog-service:
    image: eshop/catalog-service:latest
    build:
      context: .
      dockerfile: modernized/src/Catalog.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__CatalogDb: "Server=sqlserver;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
    # gRPC over HTTP/2 (cleartext) exposed on the host.
    ports:
      - "8083:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
