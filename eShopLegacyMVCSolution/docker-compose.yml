# Non-mock topology: MVC web app -> Catalog API -> SQL Server 2022.
#   docker compose up --build
#   MVC: http://localhost:5000   Catalog API: http://localhost:5100/swagger
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Pass@word1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S tcp:127.0.0.1,1433 -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  catalog-api:
    build:
      context: .
      dockerfile: src/eShop.Catalog.Api/Dockerfile
    environment:
      UseMockData: "false"
      UseCustomizationData: "false"
      ConnectionStrings__CatalogContext: "Server=sqlserver,1433;Database=eShop.Catalog;User Id=sa;Password=${SA_PASSWORD:-Pass@word1};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "5100:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  webmvc:
    build:
      context: .
      dockerfile: src/eShopLegacyMVC/Dockerfile
    environment:
      UseMockData: "false"
      UseCustomizationData: "false"
      CatalogApi__BaseUrl: "http://catalog-api:8080"
    ports:
      - "5000:8080"
    depends_on:
      - catalog-api

volumes:
  sqldata:
