name: eshop-modernized

# Local development stack: one SQL Server 2022 container plus the three .NET 8 services.
# See docs/containers.md for ports, environment variables and the run instructions.

x-catalog-connection: &catalog-connection
  ConnectionStrings__Catalog: "Server=sqlserver,1433;Database=${CATALOG_DB_NAME:-CatalogDb};User Id=sa;Password=${MSSQL_SA_PASSWORD:-Pass@word1};Encrypt=False;TrustServerCertificate=True;MultipleActiveResultSets=True"
  Catalog__UseMockData: "false"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Pass@word1}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - catalog-db:/var/opt/mssql
    healthcheck:
      # Gates the app services: they only start once SQL Server answers a query, not merely once
      # the container is running.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  catalog-api:
    build:
      context: .
      dockerfile: src/eShop.Catalog.Api/Dockerfile
    image: eshop-modernized/catalog-api:local
    environment:
      <<: *catalog-connection
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # This service alone migrates and seeds the database (AddCatalogSeeding is wired here only).
      # With customization data on, seeding also re-extracts Setup/CatalogItems.zip over /app/Pics,
      # which the image makes writable for the non-root user.
      Catalog__UseCustomizationData: ${CATALOG_USE_CUSTOMIZATION_DATA:-false}
    ports:
      - "${CATALOG_API_PORT:-8081}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  catalog-grpc:
    build:
      context: .
      dockerfile: src/eShop.Catalog.Grpc/Dockerfile
    image: eshop-modernized/catalog-grpc:local
    environment:
      <<: *catalog-connection
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      - "${CATALOG_GRPC_PORT:-8082}:8080"
    depends_on:
      # Only catalog-api migrates and seeds (AddCatalogSeeding is wired there alone); this service
      # just needs the server reachable and tolerates starting before seeding has finished.
      sqlserver:
        condition: service_healthy
    restart: on-failure

  web:
    build:
      context: .
      dockerfile: src/eShop.Web/Dockerfile
    image: eshop-modernized/web:local
    environment:
      <<: *catalog-connection
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

volumes:
  catalog-db:
